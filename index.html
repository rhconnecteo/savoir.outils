<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Outils à créer - IT</title>
  <link rel="icon" type="image/png" href="mathematiques.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- LOGIN MODAL -->
  <div id="loginModal" class="login-modal">
    <div class="login-container">
      <div class="login-box">
        <h2>Connexion</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="username">Identifiant:</label>
            <input type="text" id="username" required />
          </div>
          <div class="form-group">
            <label for="password">Mot de passe:</label>
            <input type="password" id="password" required />
          </div>
          <div id="loginError" class="login-error"></div>
          <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT (Hidden until login) -->
  <div id="mainContent" class="main-content" style="display: none;">
      <div class="header-content">
      <h1>📋 Outils à créer - Suivi IT</h1>
      <button class="btn btn-logout" onclick="handleLogout()">Déconnexion</button>
    </div>
  </header>

  <section class="card">
    <h2>Liste des outils par collaborateur</h2>

    <!-- Filtres -->
    <div class="filters-container">
      <div class="filter-group">
        <label for="filterMatricule">Filtrer par Matricule</label>
        <select id="filterMatricule" onchange="applyFilters()">
          <option value="">-- Tous les matricules --</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filterFonction">Filtrer par Fonction</label>
        <select id="filterFonction" onchange="applyFilters()">
          <option value="">-- Toutes les fonctions --</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filterRattachement">Filtrer par Rattachement</label>
        <select id="filterRattachement" onchange="applyFilters()">
          <option value="">-- Tous les rattachements --</option>
        </select>
      </div>

      <button class="btn btn-secondary" onclick="resetFilters()">🔄 Réinitialiser</button>
    </div>

    <!-- Tableau -->
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Matricule</th>
            <th>Nom</th>
            <th>Fonction</th>
            <th>Rattachement</th>
            <th>Login</th>
            <th>Outil</th>
            <th>Statut</th>
            <th>Date Début</th>
            <th>Date Fin</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>

    <div id="emptyMessage" style="text-align: center; padding: 20px; color: #999; display: none;">
      Aucune donnée à afficher
    </div>

  </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
